<!DOCTYPE html>
<html>
<head>
    <title>HFC App Debug</title>
</head>
<body>
    <h1>HFC App Debug Tool</h1>
    <div id="debug-info"></div>
    
    <script>
        // Test API connectivity
        async function testAPI() {
            const debugDiv = document.getElementById('debug-info');
            
            try {
                // Test 1: Check if user is logged in
                const token = localStorage.getItem('authToken');
                debugDiv.innerHTML += `<p>🔑 Auth Token: ${token ? 'EXISTS' : 'MISSING'}</p>`;
                
                if (!token) {
                    debugDiv.innerHTML += `<p>❌ No auth token found. Please log in first.</p>`;
                    return;
                }
                
                // Test 2: Test backend connectivity
                const response = await fetch('https://hfc-app.onrender.com/api/v1/workbook', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                debugDiv.innerHTML += `<p>🌐 Backend Response: ${response.status} ${response.statusText}</p>`;
                
                if (response.ok) {
                    const data = await response.json();
                    debugDiv.innerHTML += `<p>📊 Workbook Data: ${JSON.stringify(data, null, 2)}</p>`;
                } else {
                    const error = await response.text();
                    debugDiv.innerHTML += `<p>❌ Error: ${error}</p>`;
                }
                
            } catch (error) {
                debugDiv.innerHTML += `<p>❌ Network Error: ${error.message}</p>`;
            }
        }
        
        // Run test when page loads
        testAPI();
    </script>
</body>
</html>
